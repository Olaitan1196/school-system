<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 500px;
            height: 350px;
            background: linear-gradient(135deg, #4c1d95, #7c3aed, #a78bfa);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            border-radius: 16px;
            overflow: hidden;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .school-name {
            color: white;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .tagline {
            color: #ddd6fe;
            font-size: 13px;
            margin-bottom: 40px;
        }

        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: white;
            border-radius: 4px;
            animation: load 2.8s ease-in-out forwards;
        }

        .loading-text {
            color: #c4b5fd;
            font-size: 11px;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        @keyframes load {
            0%   { width: 0%; }
            30%  { width: 40%; }
            60%  { width: 70%; }
            90%  { width: 90%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="logo">🎓</div>
    <div class="school-name">Comforters' College</div>
    <div class="tagline">School Management System</div>
    <div class="loader">
        <div class="loader-bar"></div>
    </div>
    <div class="loading-text">STARTING SYSTEM...</div>
</body>
</html>
